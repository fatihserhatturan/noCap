[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nocap"
version = "0.1.0"
description = "Hip-hop flow and rhythm analyzer"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "pronouncing>=0.2",
    "syllables>=1.0",
    "click>=8.0",
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
separator = ["demucs>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
nocap = "nocap.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["nocap*"]
